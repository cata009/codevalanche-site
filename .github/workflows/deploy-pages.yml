name: Check Codevalanche site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check account contracts
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload validated static build
        uses: actions/upload-artifact@v4
        with:
          name: codevalanche-site
          path: ./dist
