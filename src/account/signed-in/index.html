<section id="signed-in"><div class="cr-head"><h1 class="cr-page-title">You're signed in</h1><p class="cr-tagline">Codevalanche on your computer has your account now. You can close this tab and go back to the app.</p></div>

<script>
  // The desktop app opened this tab for sign-in; a browser lets a script close
  // a tab only when a script opened it, so the button and the hint stay for
  // the case where this quietly does nothing.
  document.getElementById("close").addEventListener("click", function () { window.close() })
  setTimeout(function () { window.close() }, 1500)
</script></body></html>
